name: Export current Sim Pedals source

on:
  push:
    branches: [from-claude]
    paths:
      - ".github/workflows/export-current-source.yml"
      - "sim_pedals_v5.1.zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Extract and export complete source tree
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          src = Path("sim_pedals_v5.1.zip")
          with zipfile.ZipFile(src) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"Corrupt ZIP member: {bad}")
              z.extractall("project")
          required = [
              "pc_app/app.py", "pc_app/device.py", "pc_app/widgets.py",
              "pc_app/protocol.py", "firmware_pedals/src/ads1220.c",
              "firmware_pedals/src/main.c", "firmware_hub/src/main.c",
              "common/pedal_protocol.h", "tests/test_ads.c"
          ]
          missing = [f for f in required if not (Path("project")/f).is_file()]
          if missing:
              raise SystemExit("Missing required files: " + ", ".join(missing))
          print("Complete project extracted:")
          for f in sorted(Path("project").rglob("*")):
              if f.is_file():
                  print(f"{f.stat().st_size:8d}  {f}")
          PY
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile("sim-pedals-source.zip", "w", zipfile.ZIP_DEFLATED, 6) as z:
              for p in sorted(Path("project").rglob("*")):
                  if p.is_file():
                      z.write(p, p.relative_to("project").as_posix())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sim-pedals-complete-source
          path: sim-pedals-source.zip
          if-no-files-found: error
          retention-days: 30
