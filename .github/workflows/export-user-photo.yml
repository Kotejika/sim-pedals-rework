name: Export user wallpaper for UI repair

on:
  push:
    branches: [ui-repair-20261111]
    paths:
      - ".github/workflows/export-user-photo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout UI repair branch
        uses: actions/checkout@v4
        with:
          ref: ui-repair-20261111

      - name: Checkout user photo branch read-only
        uses: actions/checkout@v4
        with:
          ref: photo
          path: photo-source

      - name: Verify and package the uploaded wallpaper
        run: |
          set -euo pipefail
          mkdir -p wallpaper
          test -s "photo-source/Уютный вечер у окна.png"
          cp "photo-source/Уютный вечер у окна.png" wallpaper/user-wallpaper.png
          file wallpaper/user-wallpaper.png
          sha256sum wallpaper/user-wallpaper.png
          python3 - <<'PY'
          import struct
          from pathlib import Path
          b = Path("wallpaper/user-wallpaper.png").read_bytes()
          if b[:8] != bytes([137, 80, 78, 71, 13, 10, 26, 10]):
              raise SystemExit("User wallpaper is not a PNG")
          width, height = struct.unpack(">II", b[16:24])
          if width < 640 or height < 360:
              raise SystemExit(f"Wallpaper dimensions too small: {width}x{height}")
          print(f"User wallpaper verified: PNG {width}x{height}, {len(b)} bytes")
          PY

      - name: Upload wallpaper
        uses: actions/upload-artifact@v4
        with:
          name: user-wallpaper-for-sim-pedals
          path: wallpaper/user-wallpaper.png
          if-no-files-found: error
          retention-days: 14

# Trigger a second push so the workflow is picked up.
